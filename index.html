<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="ForgeFit is a private, offline-first dumbbell and bodyweight workout tracker.">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ForgeFit</title>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-view="today" aria-label="Go to Today">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span><strong>ForgeFit</strong><small>Home training, without the circus</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="ghost-btn">Install app</button>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <main id="mainContent" class="main-content" tabindex="-1">
      <section id="view-today" class="view active" aria-labelledby="todayTitle"></section>
      <section id="view-workouts" class="view" aria-labelledby="workoutsTitle"></section>
      <section id="view-build" class="view" aria-labelledby="buildTitle"></section>
      <section id="view-history" class="view" aria-labelledby="historyTitle"></section>
      <section id="view-progress" class="view" aria-labelledby="progressTitle"></section>
      <section id="view-settings" class="view" aria-labelledby="settingsTitle"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="today" class="active"><span>⌂</span><small>Today</small></button>
      <button data-view="workouts"><span>▦</span><small>Workouts</small></button>
      <button data-view="build"><span>＋</span><small>Build</small></button>
      <button data-view="history"><span>◷</span><small>History</small></button>
      <button data-view="progress"><span>↗</span><small>Progress</small></button>
    </nav>
  </div>

  <dialog id="runnerDialog" class="runner-dialog"></dialog>
  <dialog id="detailsDialog" class="details-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importInput" type="file" accept="application/json" hidden>
  <script src="./pdf-report.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
